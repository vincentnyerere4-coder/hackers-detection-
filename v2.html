<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VINCENT PRO V2</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:15px}.box{border:2px solid #0f0;border-radius:15px;padding:15px;max-width:500px;margin:auto}input{width:100%;box-sizing:border-box;padding:14px;margin:10px 0;background:#111;color:#0f0;border:1px solid #0f0;border-radius:10px}button{width:100%;padding:16px;background:#0f0;color:#000;font-weight:bold;border:none;border-radius:10px;font-size:18px}.info{color:#0ff;font-size:13px}.alert{background:#300;color:#f00;padding:12px;border-left:5px solid #f00;margin-top:10px;border-radius:8px}.ok{background:#030;color:#0f0;padding:12px;border-left:5px solid #0f0;margin-top:10px;border-radius:8px}</style></head><body><div class="box"><h1 style="text-align:center">VINCENT NYERERE<br>HACKER DETECTION PRO V2</h1><p id="myip" class="info">> Detecting your IP...</p><p id="loc" class="info">> Location: loading...</p><input id="ip" placeholder="Target IP"><input id="tries" type="number" placeholder="Tries e.g 100"><button onclick="scan()">START SCAN</button><div id="result"></div><p style="font-size:10px;text-align:center;color:#555;margin-top:20px">PRO V2 By Vincent</p></div><script>fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{document.getElementById('myip').innerText='> Your IP: '+d.ip;document.getElementById('ip').value=d.ip;fetch('https://ipapi.co/'+d.ip+'/json/').then(r=>r.json()).then(l=>{document.getElementById('loc').innerText='> Location: '+(l.city||'')+' '+(l.country_name||'')});});function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();o.frequency.value=900;o.connect(c.destination);o.start();setTimeout(()=>o.stop(),400)}catch(e){}}function scan(){let ip=document.getElementById('ip').value||'192.168.1.1';let t=parseInt(document.getElementById('tries').value)||0;let res=document.getElementById('result');res.innerHTML='<p class=info>> Scanning '+ip+'...</p>';setTimeout(()=>{if(t>=25){beep();res.innerHTML+='<div class=alert>[!!] HACKER IP: '+ip+'<br>Tried '+t+' times - BLOCK IT!<br><button style=background:#f00;color:#fff;width:100%;padding:10px;border:none;border-radius:8px;margin-top:8px onclick="this.innerText=\'BLOCKED!\';beep()">BLOCK NOW</button></div>'}else{res.innerHTML+='<div class=ok>[+] IP '+ip+' - '+t+' tries - SAFE</div>'}},800)}</script></body></html>
