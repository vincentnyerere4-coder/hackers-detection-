
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VINCENT V3 PRO</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:10px;margin:0}.box{border:2px solid #0f0;border-radius:15px;padding:15px;max-width:480px;margin:auto}input{width:100%;padding:13px;margin:7px 0;background:#111;color:#0f0;border:1px solid #0f0;border-radius:8px;box-sizing:border-box}button{width:100%;padding:14px;font-weight:bold;border:none;border-radius:8px;margin:6px 0;cursor:pointer;font-size:16px}.scan{background:#0f0;color:#000}.mpesa{background:#ffcc00;color:#000;border:2px solid #fff}.gpsbox{background:#001a22;color:#0ff;border:1px solid #0ff;padding:12px;border-radius:10px;margin:10px 0;font-size:13px}.alert{background:#300;color:#f00;padding:12px;border-left:4px solid #f00;margin-top:10px;border-radius:6px}.ok{background:#021;color:#0f0;padding:12px;border-left:4px solid #0f0;margin-top:10px;border-radius:6px}.lock{background:#222;color:#ff0;padding:15px;border:2px dashed #ff0;border-radius:10px;text-align:center;margin-top:15px}</style></head><body><div class="box"><h2 style="text-align:center;margin:0">VINCENT PRO V3<br><span style="color:#ffcc00">MONEY EDITION</span></h2><div class="gpsbox" id="gps">📍 Location: Bado haijapatikana.<br>Bonyeza kupata mtaa wako halisi Dar.</div><button onclick="getGPS()" style="background:#0ff;color:#000">📍 PATA LOCATION YANGU SAHIHI</button><p id="myip" style="color:#0ff;font-size:12px">> IP Loading...</p><input id="ip" placeholder="Target IP"><input id="tries" type="number" placeholder="Tries e.g 30"><button class="scan" onclick="scan()">🔍 START SCAN</button><div id="result"></div><div class="lock" id="lockBox" style="display:none"><h3>🔒 PRO LOCKED</h3><p>Umetumia scan 2 za BURE.<br>Lipia <b>Tsh 5,000</b> kwenda namba<br>0793641536 kuendelea.</p><a href="tel:*150*01*1*255793641536*5000%23" style="text-decoration:none"><button class="mpesa">💰 LIPA KWA TIGO PESA - 5,000/= 0793641536</button></a><p style="font-size:12px;margin-top:10px">Baada ya kulipa ingiza CODE: <b>2026</b></p><input id="code" placeholder="Ingiza CODE"><button onclick="unlock()" style="background:#fff;color:#000">UNLOCK PRO</button><p style="font-size:10px">Msaada: 0793641536</p></div></div><script>let scans=parseInt(localStorage.getItem('v3scans')||'0');let unlocked=localStorage.getItem('v3unlocked')==='yes';fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{document.getElementById('myip').innerText='> Your IP: '+d.ip+' | Used: '+scans+'/2';document.getElementById('ip').value=d.ip});function getGPS(){let g=document.getElementById('gps');g.innerText='⏳ Inatafuta... Kubali Location.';if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{g.innerHTML='📍 <b>LOCATION YAKO SAHIHI:</b><br>Lat: '+p.coords.latitude.toFixed(6)+'<br>Lng: '+p.coords.longitude.toFixed(6)+'<br><a href="https://maps.google.com/?q='+p.coords.latitude+','+p.coords.longitude+'" target="_blank" style="color:#ff0">▶ Fungua Google Maps</a><br><span style="color:#0f0">Dar es Salaam, TZ</span>'},e=>{g.innerText='❌ Ruhusu Location: '+e.message})}else{g.innerText='Simu haina GPS'}}function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();o.frequency.value=900;o.connect(c.destination);o.start();setTimeout(()=>o.stop(),500)}catch(e){}}function scan(){if(!unlocked&&scans>=2){document.getElementById('lockBox').style.display='block';document.getElementById('result').innerHTML='<div class=alert>🔒 Umemaliza 2 za bure! Lipia 0793641536 kuendelea.</div>';return}let ip=document.getElementById('ip').value||'192.168.1.1';let t=parseInt(document.getElementById('tries').value)||0;let res=document.getElementById('result');res.innerHTML='<p style=color:#0ff>> Scanning '+ip+'...</p>';scans++;localStorage.setItem('v3scans',scans);document.getElementById('myip').innerText='> IP: '+ip+' | Used: '+scans+'/2';setTimeout(()=>{if(t>=25){beep();res.innerHTML+='<div class=alert>[!!] HACKER FOUND: '+ip+'<br>Tries: '+t+' - HATARI!<br><button style=background:#f00;color:#fff;width:100%;padding:10px;border:none;border-radius:6px;margin-top:6px onclick="this.innerText=\'BLOCKED!\'">BLOCK NOW</button></div>'}else{res.innerHTML+='<div class=ok>[+] '+ip+' - '+t+' tries - SAFE</div>'}if(!unlocked&&scans>=2)document.getElementById('lockBox').style.display='block'},700)}function unlock(){let c=document.getElementById('code').value;if(c==='2026'||c==='vincent'){localStorage.setItem('v3unlocked','yes');unlocked=true;alert('✅ ASANTE! PRO IMEFUNGULIWA!');document.getElementById('lockBox').style.display='none'}else{alert('CODE si sahihi! Tumia 2026 kwa majaribio.')}}</script></body></html>
