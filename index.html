
<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020617;color:#fff;font-family:Arial;padding:15px}.container{max-width:500px;margin:auto;background:#0f172a;border-radius:15px;border:1px solid #3b82f6;overflow:hidden}.header{background:linear-gradient(135deg,#1e40af,#3b82f6);padding:20px;text-align:center}.box{padding:20px}.item{background:#1e293b;padding:12px;margin:8px 0;border-radius:8px;border-left:4px solid #3b82f6}.item span{color:#94a3b8;font-size:11px;display:block}.safe{background:rgba(34,197,94,0.1);border:2px solid #22c55e;border-radius:10px;padding:15px;text-align:center;margin:15px 0}.map{width:100%;height:180px;border-radius:10px;border:1px solid #334155}.tip{background:#1e293b;padding:10px;margin:6px 0;border-radius:6px;font-size:13px}.btn{width:100%;padding:14px;margin:7px 0;border:none;border-radius:8px;font-weight:bold}.btn-blue{background:#3b82f6;color:#fff}.btn-green{background:#25D366;color:#fff}.btn-dark{background:#334155;color:#fff}.footer{text-align:center;padding:12px;font-size:11px;color:#64748b}</style></head><body><div class="container"><div class="header"><h1>🛡️ CYBER CHECK V6</h1><p>By Vincent - Dar</p></div><div class="box"><div id="loading">⏳ Inapima...</div><div id="content" style="display:none"><div class="item"><span>IP</span><b id="ip">-</b></div><div class="item"><span>LOCATION</span><b id="loc">-</b></div><div class="item"><span>NETWORK</span><b id="isp">-</b></div><div class="item"><span>DEVICE</span><b id="device">-</b></div><div class="safe"><h2>✅ SIMU IKO SALAMA 100%</h2></div><iframe id="map" class="map" frameborder="0"></iframe><div class="tip">✅ Washa Two-Factor</div><div class="tip">✅ Usibonyeze link za ajabu</div><div class="tip">✅ Badilisha password</div><button class="btn btn-blue" onclick="window.open('https://www.facebook.com/settings?tab=security','_blank')">🔒 WEKA 2-FACTOR</button><button class="btn btn-green" id="waBtn">📤 WHATSAPP</button><button class="btn btn-dark" id="smsBtn">💬 SMS</button></div></div><div class="footer">Elimu ya Usalama - TZ</div></div><script>fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>{ip.innerText=d.ip;loc.innerText=d.city+","+d.country_name;isp.innerText=d.org;device.innerText=navigator.userAgent.slice(0,60);map.src=`https://www.openstreetmap.org/export/embed.html?bbox=${d.longitude-0.1},${d.latitude-0.1},${d.longitude+0.1},${d.latitude+0.1}&layer=mapnik&marker=${d.latitude},${d.longitude}`;let m=`🛡️ V6%0A✅ SALAMA%0A📍 ${d.city}%0Ahttps://vincentnyerere4-coder.github.io/hackers-detection-/`;loading.style.display='none';content.style.display='block';waBtn.onclick=()=>open(`https://wa.me/?text=${m}`,'_blank');smsBtn.onclick=()=>open(`sms:?&body=${m}`,'_blank')})</script></body></html>
